<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Village Welfare Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .header { background: #2c3e50; color: white; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .card h3 { margin: 0; color: #7f8c8d; font-size: 14px; text-transform: uppercase; }
        .card .value { font-size: 24px; font-weight: bold; color: #2c3e50; margin-top: 10px; }
        .loading { text-align: center; font-style: italic; color: #7f8c8d; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🏠 Village Welfare & Management</h1>
    </div>

    <div id="loading" class="loading">Loading dashboard data from database...</div>

    <div class="dashboard-grid" id="dashboard" style="display: none;">
        <div class="card">
            <h3>Total Families</h3>
            <div class="value" id="val-families">--</div>
        </div>
        <div class="card">
            <h3>Total Persons</h3>
            <div class="value" id="val-persons">--</div>
        </div>
        <div class="card">
            <h3>Emergency Fund</h3>
            <div class="value" id="val-fund">--</div>
        </div>
        <div class="card">
            <h3>Monthly Contribution</h3>
            <div class="value" id="val-contrib">--</div>
        </div>
    </div>

    <script>
        // Replace this with your Google Apps Script Web App URL
        const API_URL = 'YOUR_WEB_APP_URL_HERE?action=getDashboardData';

        async function loadDashboard() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                if(data.status === "success") {
                    document.getElementById('val-families').innerText = data.families;
                    document.getElementById('val-persons').innerText = data.persons;
                    document.getElementById('val-fund').innerText = data.emergencyFund;
                    document.getElementById('val-contrib').innerText = data.monthlyContribution;
                    
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'grid';
                }
            } catch (error) {
                document.getElementById('loading').innerText = "Error loading data. Please check the connection.";
                console.error("Dashboard Error:", error);
            }
        }

        // Initialize dashboard on page load
        window.onload = loadDashboard;
    </script>
</body>
</html>
